# Edge host: WireGuard manager with host networking (listen on wg0 + UDP 51820 outside Docker).
# Typical deployment: terminate TLS on Caddy/nginx and reverse-proxy to 127.0.0.1:9090.
#
# Usage:
#   docker compose -f docker-compose.edge.yml up -d --build
#
# Firewall (host): allow UDP 51820 for WireGuard; expose only 443 (or your TLS port) from the Internet
# to the reverse proxy, not 9090.

services:
  wgmgr:
    build: .
    env_file:
      - .env
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      PORT: "9090"
      # Required when the management port is reachable beyond localhost.
      WGMGR_ADMIN_TOKEN: "${WGMGR_ADMIN_TOKEN:-}"
      WGMGR_MODE: "real"
      WGMGR_REAL_INTERFACE: "wg0"
      WGMGR_REAL_OUTPUT_DIR: "/var/lib/mira-wgmgr/peers"
      WGMGR_REAL_DRY_RUN: "false"
      # Optional: same JSON as control plane (file wins over inline JSON).
      # WGMGR_LOCATION_PROFILES_FILE: "/etc/mira/location-profiles.json"
    volumes:
      - mira-wgmgr-peers:/var/lib/mira-wgmgr/peers
      # - ./config/location-profiles.json:/etc/mira/location-profiles.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mira-wgmgr-peers:
